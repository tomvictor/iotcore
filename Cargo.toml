[package]
name = "iotcore"
version = "0.4.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "iotcore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["py-clone"] }
pyo3-log = "0.13"
log = "0.4"
rumqttc = "0.25.0"
rumqttd = "0.20.0"
config = "0.15.19"
